name: Deploy to GitHub Pages

on:
  push:
    branches: [coba]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run publish:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish static site files to the Pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all -- index.html 404.html assets image basemap-preview EstheraLocus-Logo.svg
          if git diff --cached --quiet; then
            echo "The static site is already up to date."
          else
            git commit -m "Publish website build [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
